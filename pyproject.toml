[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdl-studio"
version = "1.0.0"
description = "Unlimited YouTube and YouTube Music downloader and converter with playlists, batches, and full-quality output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ytdl-studio contributors" }]
keywords = ["youtube", "youtube-music", "yt-dlp", "ffmpeg", "downloader", "converter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "yt-dlp>=2024.12.13",
    "httpx>=0.27.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
ytdl = "ytdl.cli:main"
ytdl-gui = "ytdl.gui:main"

[project.urls]
Homepage = "https://github.com/example/ytdl-studio"
Documentation = "https://github.com/example/ytdl-studio#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytdl*"]

[tool.setuptools.package-data]
ytdl = ["py.typed", "gui/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that use the network or external tools",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"ytdl/cli.py" = ["B008"]  # Typer options are intentionally constructed in defaults
